name: tests

on:
  push:
    branches: ["20.0", "fix/**", "feat/**"]
  pull_request:

jobs:
  parser-tests:
    name: Serbian statement parser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -q l10n_rs_bank_statement_import/tests/test_halcom.py l10n_rs_bank_statement_import/tests/test_asseco.py l10n_rs_bank_statement_import/tests/test_rol.py

  odoo-tests:
    name: Odoo 20 integration tests
    runs-on: ubuntu-latest
    container:
      image: odoo:20.0
      options: --user root
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install OCA dependencies
        # account_statement_base: pending OCA/account-reconcile PR #1048 (kmee),
        # pinned by sha. account_statement_import_base/_file: OCA has no 20.0
        # branch yet, so the CI-only ports under ci/oca20/ are used (see
        # ci/oca20/README.md).
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          git clone --depth 1 --branch 20.0-mig-account_statement_base https://github.com/kmee/account-reconcile.git /tmp/oca-reconcile
          git -C /tmp/oca-reconcile fetch --depth 1 origin 603ed6b15f9409baa915e5484ec59ea9921f8e85
          git -C /tmp/oca-reconcile checkout 603ed6b15f9409baa915e5484ec59ea9921f8e85
          ln -s /tmp/oca-reconcile/account_statement_base /mnt/extra-addons/account_statement_base
          ln -s "$GITHUB_WORKSPACE/ci/oca20/account_statement_import_base" /mnt/extra-addons/account_statement_import_base
          ln -s "$GITHUB_WORKSPACE/ci/oca20/account_statement_import_file" /mnt/extra-addons/account_statement_import_file
      - name: Run module tests
        run: |
          ln -s "$GITHUB_WORKSPACE/l10n_rs_bank_statement_import" /mnt/extra-addons/l10n_rs_bank_statement_import
          odoo --db_host=postgres --db_user=odoo --db_password=odoo \
               -d bank_import_ci -i l10n_rs_bank_statement_import \
               --test-tags /l10n_rs_bank_statement_import \
               --stop-after-init --log-level=test
